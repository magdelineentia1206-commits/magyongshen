<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kedai Ubat Magyongshen</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#f5f5f5}.hero{height:50vh;background:url('https://images.unsplash.com/photo-1579154204601-01588f351e67?w=1200') center/cover;display:flex;align-items:center;justify-content:center;color:#fff;text-align:center}.hero div{background:rgba(0,0,0,.6);padding:20px;border-radius:12px}.box{max-width:1000px;margin:auto;padding:15px}.card{background:#fff;border-radius:12px;padding:12px;box-shadow:0 2px 8px rgba(0,0,0,.1);text-align:center}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.price{color:green;font-weight:bold;font-size:18px}.btn{width:100%;padding:8px;background:green;color:#fff;border:0;border-radius:8px;margin-top:6px}</style></head><body>
<div class="hero"><div><h1>KEDAI UBAT MAGYONGSHEN</h1><p>Gambar Kedai Boss Disini</p><p>Bukit Kepong, Johor</p></div></div>
<div class="box"><h2>Stock Online - Scroll Bawah</h2><div class="grid" id="list"></div></div>
<script>
let barang=[{n:"Paracetamol",h:8,s:50},{n:"Ubat Batuk",h:12,s:30},{n:"Minyak Angin",h:6.5,s:100},{n:"Plaster",h:4,s:80}];
document.getElementById('list').innerHTML=barang.map(b=>`<div class=card><h3>${b.n}</h3><div class=price>RM ${b.h}</div><p>Stock: ${b.s}</p><button class=btn onclick="alert('Order ${b.n} - Whatsapp Boss ya boss!')">Beli - Bayar Online</button></div>`).join('');
</script></body></html>
